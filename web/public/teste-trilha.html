<!doctype html>
<!--
  Teste da opção B da análise de causa raiz da trilha: o player do YouTube troca o vídeo
  dentro do mesmo player (loadVideoById), sem recarregar, e por isso o toque dado deveria
  continuar valendo. Página solta, fora do site, só para testar em cada navegador.
  Faixas: canal oficial "Yoshihisa Hirano - Topic" (envios da gravadora pelo YouTube).
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste da trilha</title>
    <style>
      :root { --papel: #f4efe4; --tinta: #1d1a14; --acao: #b8232b; --linha: #d8cfbd; }
      @media (prefers-color-scheme: dark) { :root { --papel: #16140f; --tinta: #eee6d6; --acao: #e04b4f; --linha: #3a352b; } }
      body { margin: 0; padding: 16px; background: var(--papel); color: var(--tinta); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 40rem; margin: 0 auto; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      .telas { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
      button { font: inherit; font-weight: 700; padding: 0.6rem 1rem; border-radius: 4px; border: 2px solid var(--acao); background: transparent; color: var(--acao); cursor: pointer; }
      button[aria-pressed="true"] { background: var(--acao); color: #fff; }
      #player-caixa { width: 356px; max-width: 100%; aspect-ratio: 16 / 9; min-height: 200px; }
      #player-caixa iframe { width: 100%; height: 100%; border: 0; }
      #estado { font-weight: 700; margin: 0.75rem 0; }
      ol { padding-left: 1.2rem; font-size: 0.9rem; border-top: 1px solid var(--linha); padding-top: 0.5rem; }
      .ok { color: #2e7d32; } .erro { color: var(--acao); }
    </style>
  </head>
  <body>
    <main>
      <h1>Teste da trilha (player do YouTube)</h1>
      <p>
        1. Clique em qualquer lugar da página: a música deve começar.<br />
        2. Troque de "tela" nos botões: a faixa deve mudar sozinha, sem novo clique no player.<br />
        3. Anote o navegador e o que aparece no registro abaixo.
      </p>
      <div class="telas" role="group" aria-label="Telas simuladas">
        <button type="button" data-tela="inicio" aria-pressed="true">Início</button>
        <button type="button" data-tela="zoldyck" aria-pressed="false">Licença Zoldyck</button>
        <button type="button" data-tela="trupe" aria-pressed="false">Licença Trupe</button>
      </div>
      <div id="player-caixa"><div id="player"></div></div>
      <p id="estado">Esperando o primeiro clique…</p>
      <ol id="registro"></ol>
    </main>
    <script>
      var FAIXAS = {
        inicio: { id: "JoXhxv1MxW0", nome: "The World of Adventurers" },
        zoldyck: { id: "Dun2PPXkmVI", nome: "Ansatsu Ikka no Yakata" },
        trupe: { id: "E9IS5JrJc6Q", nome: "Requiem Aranea" },
      };
      var tela = "inicio";
      var player = null;
      var pronto = false;
      var comecou = false;
      var inicio = Date.now();

      function registrar(texto, classe) {
        var li = document.createElement("li");
        li.textContent = ((Date.now() - inicio) / 1000).toFixed(1) + " s: " + texto;
        if (classe) li.className = classe;
        document.getElementById("registro").appendChild(li);
      }
      function estado(texto) { document.getElementById("estado").textContent = texto; }
      registrar("Navegador: " + navigator.userAgent);

      // O player é criado já na abertura, para o primeiro clique só precisar dar o play
      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("player", {
          host: "https://www.youtube-nocookie.com",
          videoId: FAIXAS[tela].id,
          playerVars: { playsinline: 1, rel: 0 },
          events: {
            onReady: function () { pronto = true; registrar("Player pronto"); },
            onStateChange: function (e) {
              var nomes = { "-1": "não iniciado", 0: "terminou", 1: "tocando", 2: "pausado", 3: "carregando", 5: "na fila" };
              registrar("Estado: " + (nomes[e.data] || e.data));
              if (e.data === 1) {
                estado("Tocando " + FAIXAS[tela].nome);
                registrar("Tocando " + FAIXAS[tela].nome + " sem clique no player", "ok");
              }
              if (e.data === 0) { player.seekTo(0); player.playVideo(); } // recomeça no fim
            },
            onAutoplayBlocked: function () {
              estado("O navegador bloqueou o play. Aperte ▶ no player.");
              registrar("Bloqueado pelo navegador", "erro");
            },
            onError: function (e) { registrar("Erro do player: " + e.data, "erro"); },
          },
        });
      };
      var s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);

      // Primeiro clique ou tecla em qualquer lugar: começa a música
      function primeiroToque() {
        if (comecou) return;
        if (!pronto) { registrar("Clique antes de o player ficar pronto; clique de novo", "erro"); return; }
        comecou = true;
        registrar("Primeiro clique na página: play pedido");
        player.playVideo();
      }
      document.addEventListener("pointerdown", primeiroToque, true);
      document.addEventListener("keydown", primeiroToque, true);

      // Troca de tela: troca o vídeo dentro do mesmo player
      document.querySelectorAll("[data-tela]").forEach(function (b) {
        b.addEventListener("click", function () {
          tela = b.dataset.tela;
          document.querySelectorAll("[data-tela]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
          if (!player || !pronto) return;
          registrar("Tela " + b.textContent + ": troca para " + FAIXAS[tela].nome);
          player.loadVideoById(FAIXAS[tela].id);
        });
      });
    </script>
  </body>
</html>
